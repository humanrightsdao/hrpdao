<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Human Rights Policy DAO</title>
    <meta
      name="description"
      content="Децентралізована автономна організація захисту прав людини — прозоре управління, скарбниця та репутація учасників на блокчейні."
    />
    <link rel="canonical" href="https://humanrightspolicy.org/" />

    <!-- Open Graph / social link previews — a single static set of tags
         for the whole SPA (no server-side rendering here, so per-page
         previews like a specific /card/:address aren't possible without
         a separate edge-rendering step; this at least stops shared
         links — e.g. a Vizitka tip link pasted into Telegram/WhatsApp —
         from showing up blank). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Human Rights Policy DAO" />
    <meta property="og:title" content="Human Rights Policy DAO" />
    <meta
      property="og:description"
      content="Децентралізована автономна організація захисту прав людини — прозоре управління, скарбниця та репутація учасників на блокчейні."
    />
    <meta property="og:url" content="https://humanrightspolicy.org/" />
    <meta property="og:image" content="https://humanrightspolicy.org/logo.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Human Rights Policy DAO" />
    <meta
      name="twitter:description"
      content="Децентралізована автономна організація захисту прав людини — прозоре управління, скарбниця та репутація учасників на блокчейні."
    />
    <meta name="twitter:image" content="https://humanrightspolicy.org/logo.png" />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Cinzel:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
