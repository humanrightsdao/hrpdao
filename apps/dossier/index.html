<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Dossier from HRP DAO — a decentralized autonomous organization built on Lens Chain for documenting human rights violations, coordinating collective advocacy, and connecting people with an AI legal advisor referencing constitutional and international human rights law."
        />
        <title>Dossier from HRP DAO</title>

        <!--
          Mirrors the logic of src/hooks/useTheme.js (verified — the
          localStorage key and value match 1:1: "theme" → "dark"/"light",
          the default for new visitors is the system preference).
          The script must stay synchronous (no type="module"/defer/async)
          and run BEFORE any CSS/bundle — that's exactly why it runs
          before the first painted frame and prevents a theme flash.
        -->
        <script>
            (function () {
                try {
                    var saved = localStorage.getItem("theme");
                    var isDark = saved
                        ? saved === "dark"
                        : window.matchMedia("(prefers-color-scheme: dark)")
                              .matches;
                    if (isDark) document.documentElement.classList.add("dark");
                } catch (e) {
                    document.documentElement.classList.add("dark");
                }
            })();
        </script>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="preload"
            as="style"
            href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&display=swap"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&display=swap"
            rel="stylesheet"
            media="print"
            onload="this.media='all'"
        />
        <noscript>
            <link
                href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&display=swap"
                rel="stylesheet"
            />
        </noscript>

        <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
    </head>
    <body>
        <main id="root">
            <!--
              A static placeholder with NO JS at all — visible right away
              along with the HTML document, before the bundle even loads/
              runs. Once React mounts, it replaces this with the real app
              (the first component to mount takes over from here — its
              own loadingSkeleton if the page has one, or a regular spinner).

              The "hrp-boot" class + the CSS below, instead of an inline
              background — so the placeholder's color matches the "dark"
              class, which the script in <head> has already set on <html>
              by then (it's synchronous and runs before <body> is parsed).
              This way the placeholder also correctly reacts to the light
              theme, instead of always being dark.
            -->
            <div class="hrp-boot">
                <div class="hrp-boot-spinner"></div>
            </div>
        </main>
        <style>
            .hrp-boot {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #ffffff;
            }
            html.dark .hrp-boot {
                background: #00091c;
            }
            .hrp-boot-spinner {
                width: 40px;
                height: 40px;
                border: 2px solid rgba(0, 0, 0, 0.1);
                border-top-color: #b41e3c;
                border-radius: 50%;
                animation: hrp-initial-spin 0.8s linear infinite;
            }
            html.dark .hrp-boot-spinner {
                border-color: rgba(255, 255, 255, 0.15);
                border-top-color: #e8a0b0;
            }
            @keyframes hrp-initial-spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
