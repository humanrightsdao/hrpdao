[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Версія пришпилена явно, щоб форджу не довелось вгадувати сумісний
# компілятор. forge сам завантажить потрібну версію через svm при
# першому запуску (потрібен мережевий доступ до binaries.soliditylang.org
# — це звичайна поведінка на робочій машині розробника).
solc = "0.8.24"

# Мігровано з Lens Network Testnet (zkSync ZK Stack, chain ID 37111, який
# вимагав "paris" через відсутність PUSH0/Shanghai+, і через це — пришпилений
# @openzeppelin/contracts ≤5.1.x, бо 5.2.0+ використовує опкод MCOPY).
#
# Arbitrum (One/Sepolia, стек Nitro) — стандартний EVM-ланцюг: Cancun-опкоди
# (MCOPY/TSTORE/TLOAD, EIP-4844) підтримуються з апгрейду ArbOS 20 "Atlas"
# (березень 2024), тож нема причин лишатись на "paris" — full Cancun.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true

remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
sepolia          = "${SEPOLIA_RPC_URL}"
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"   # testnet, chain id 421614
arbitrum_one     = "${ARBITRUM_ONE_RPC_URL}"       # mainnet, chain id 42161

[etherscan]
sepolia          = { key = "${ETHERSCAN_API_KEY}" }
arbitrum_sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api-sepolia.arbiscan.io/api" }
arbitrum_one     = { key = "${ETHERSCAN_API_KEY}", url = "https://api.arbiscan.io/api" }
